<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Feuille de route : jalons 0 a 2 termines, jalon 3 a venir, rendu le 5 janvier 2027.">
<defs><linearGradient id="fait" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="lueur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect width="1200" height="330" rx="22" fill="#0b1220"/>
<text x="48" y="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#f1f5f9">Où on en est</text>
<text x="48" y="80" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">13 semaines, 6 jalons, un rendu le 5 janvier 2027.</text>
<line x1="80" y1="168" x2="1148" y2="168" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
<line x1="80" y1="168" x2="80" y2="168" stroke="url(#fait)" stroke-width="8" stroke-linecap="round"><animate attributeName="x2" values="80;384;384" keyTimes="0;.3;1" dur="6s" fill="freeze" repeatCount="1"/><set attributeName="x2" to="384" begin="6s" fill="freeze"/></line>
<circle r="6" cy="168" fill="#e0f2fe" filter="url(#lueur2)"><animate attributeName="cx" values="80;384" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="80" cy="168" r="19" fill="url(#fait)"/>
