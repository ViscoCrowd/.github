<circle cx="78" cy="23" r="7" fill="#22c55e"/>
<text x="600" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" fill="#64748b">ViscoCrowd-simulation — make valider</text>
<text x="34" y="86" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#4ade80" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">$ viscocrowd valider-moteur<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0111;0.0231;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="115" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#f1f5f9" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">Validation du moteur — bille dans une boîte en rotation<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0678;0.0798;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="144" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#7dd3fc" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">1. Respect de la contrainte de confinement<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1022;0.1142;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="173" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   Δt = 1e-1 s    violation max   3.331e-16 m<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1367;0.1487;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="202" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   Δt = 1e-2 s    violation max   3.331e-16 m<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1711;0.1831;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="231" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   Δt = 1e-3 s    violation max   3.331e-16 m<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2056;0.2176;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="260" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#7dd3fc" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">2. Énergie mécanique, boîte fixe<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2400;0.2520;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="289" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   dissipation totale    14.224500 J<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2744;0.2864;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="318" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   plus forte remontée   0.000e+00 J    (doit être ≤ 0)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3089;0.3209;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="347" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#7dd3fc" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">3. Entraînement solide : seulement si ω²R/g ≳ 1<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3433;0.3553;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="376" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   ω = 1 rad/s    écart 1.858e+00 m/s    régime gravitaire<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3778;0.3898;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="405" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   ω = 5 rad/s    écart 1.679e-02 m/s    régime centrifuge<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4122;0.4242;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="434" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#7dd3fc" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">4. Exclusion entre agents, 36 disques, tolérance 1e-6 m<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4467;0.4587;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="463" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   Δt = 4e-3 s    recouvrement 1.00e-06 m    paroi 0.0 m    0/750<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4811;0.4931;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="492" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#cbd5e1" opacity="0" xml:space="preserve" style="white-space:pre">   Δt = 2e-3 s    recouvrement 1.00e-06 m    paroi 0.0 m    0/1500<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5156;0.5276;.95;1" dur="18s" repeatCount="indefinite"/></text>
<text x="34" y="521" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" fill="#4ade80" font-weight="700" opacity="0" xml:space="preserve" style="white-space:pre">✔ Validation réussie : tous les critères chiffrés tiennent leur seuil.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5500;0.5620;.95;1" dur="18s" repeatCount="indefinite"/></text>
