<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Terminal : sortie de la commande viscocrowd valider-moteur, tous les criteres tiennent leur seuil." xml:space="preserve">
<rect width="1200" height="590" rx="18" fill="#0a0f1a" stroke="#1e293b" stroke-width="2"/>
<path d="M0 18a18 18 0 0 1 18-18h1164a18 18 0 0 1 18 18v28H0z" fill="#111827"/>
<circle cx="30" cy="23" r="7" fill="#ef4444"/>
